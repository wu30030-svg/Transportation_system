<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>接駁車勤務</title>

    <link rel="stylesheet" href="./shuttle-driver.css">
</head>

<body>

    <main class="driver-app">

        <!-- Header -->
        <header class="driver-header">
            <div>
                <div class="system-title">
                    接駁車中心
                </div>

                <div class="system-subtitle">
                    Shuttle Center
                </div>
            </div>

            <div class="connection-status">
                <span class="status-dot"></span>
                <span>系統正常</span>
            </div>

            <button id="logout-btn" type="button">
                登出
            </button>
        </header>


        <!-- Driver Identity -->
        <section class="driver-card">

            <div class="vehicle-icon">
                🚌
            </div>

            <div class="driver-info">

                <div class="vehicle-number">
                    A-001
                </div>

                <div class="driver-name">
                    測試駕駛
                </div>

                <div class="route-name">
                    A 路線
                </div>

            </div>

        </section>


        <!-- GPS Status -->
        <section id="shuttle-gps-monitor-status" class="shuttle-gps-monitor-status starting">

            <div class="gps-monitor-title">
                🟡 正在取得 GPS
            </div>

            <div class="gps-monitor-detail">
                正在等待手機定位
            </div>

        </section>


        <!-- GPS Information -->
        <section class="gps-info-card">

            <div class="info-row">
                <span>GPS 狀態</span>

                <strong id="gpsState">
                    啟動中
                </strong>
            </div>

            <div class="info-row">
                <span>最後更新</span>

                <strong id="lastUpdate">
                    --:--:--
                </strong>
            </div>

            <div class="info-row">
                <span>定位精度</span>

                <strong id="accuracy">
                    --
                </strong>
            </div>

        </section>


        <!-- Sending Status -->
        <section class="sending-card">

            <div class="sending-indicator">

                <span id="sendingDot" class="sending-dot">
                </span>

                <div>

                    <div id="sendingTitle" class="sending-title">
                        正在確認定位
                    </div>

                    <div id="sendingDescription" class="sending-description">
                        請保持手機定位與網路開啟
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="../config.js"></script>
    <script src="../auth/auth.js"></script>
    <script src="modules/shuttle-webrtc.js"></script>
    <script src="modules/shuttle-gps.js"></script>
    <script src="modules/shuttle-call.js"></script>
    <script src="./shuttle-driver.js"></script>

</body>

</html>
